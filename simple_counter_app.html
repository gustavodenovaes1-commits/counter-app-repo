<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pop': 'pop 0.15s ease-out',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.95)' },
                            '50%': { transform: 'scale(1.05)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Smooth scale bounce on number change */
        .number-bounce {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Subtle focus outlines */
        button:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-full flex flex-col justify-center items-center p-4 selection:bg-indigo-500 selection:text-white">

    <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-3xl border border-slate-700/60 shadow-2xl p-6 md:p-8 flex flex-col items-center gap-6 relative overflow-hidden">
        
        <!-- Subtle background glowing decorative blur -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Title -->
        <header class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <span>⚡ Counter App</span>
            </h1>
            <p class="text-xs text-slate-400">Click buttons or use Up / Down arrow keys</p>
        </header>

        <section class="w-full bg-slate-950/60 rounded-2xl p-8 border border-slate-800/80 flex flex-col items-center justify-center relative min-h-[160px] shadow-inner">
            <span id="counterValue" class="text-7xl font-extrabold tracking-tight text-white transition-all duration-150 tabular-nums">
                0
            </span>
            <span id="counterStatus" class="text-xs font-medium text-slate-500 mt-2 tracking-wider uppercase">
                Zero
            </span>
        </section>

        <div class="w-full flex items-center justify-between text-xs text-slate-400 bg-slate-900/50 p-1.5 rounded-xl border border-slate-800">
            <span class="pl-2.5 font-medium">Step Size:</span>
            <div class="flex items-center gap-1">
                <button onclick="setStep(1)" id="step-1" class="step-btn px-3 py-1 rounded-lg font-semibold transition bg-indigo-600 text-white shadow-sm">1</button>
                <button onclick="setStep(5)" id="step-5" class="step-btn px-3 py-1 rounded-lg font-semibold transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200">5</button>
                <button onclick="setStep(10)" id="step-10" class="step-btn px-3 py-1 rounded-lg font-semibold transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200">10</button>
            </div>
        </div>

        <div class="w-full grid grid-cols-2 gap-4">
            <!-- Decrement Button -->
            <button id="decrementBtn" onclick="changeCount(-1)" 
                class="group relative flex items-center justify-center gap-2 py-4 px-6 bg-rose-600/90 hover:bg-rose-500 active:scale-95 transition-all duration-150 rounded-2xl font-bold text-lg text-white shadow-lg shadow-rose-950/30 border border-rose-500/30 touch-manipulation">
                <svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
                </svg>
                <span>Decrement</span>
            </button>

            <!-- Increment Button -->
            <button id="incrementBtn" onclick="changeCount(1)" 
                class="group relative flex items-center justify-center gap-2 py-4 px-6 bg-emerald-600/90 hover:bg-emerald-500 active:scale-95 transition-all duration-150 rounded-2xl font-bold text-lg text-white shadow-lg shadow-emerald-950/30 border border-emerald-500/30 touch-manipulation">
                <svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                <span>Increment</span>
            </button>
        </div>

        <div class="w-full flex items-center justify-between gap-3 pt-2">
            <button onclick="resetCount()" 
                class="w-full py-2.5 px-4 bg-slate-700/60 hover:bg-slate-700 active:scale-95 transition-all rounded-xl font-medium text-sm text-slate-300 hover:text-white flex items-center justify-center gap-2 border border-slate-600/40">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Reset</span>
            </button>

            <button onclick="toggleAudio()" id="audioToggle" 
                class="py-2.5 px-4 bg-slate-700/60 hover:bg-slate-700 active:scale-95 transition-all rounded-xl font-medium text-sm text-slate-400 hover:text-white flex items-center justify-center gap-1.5 border border-slate-600/40"
                title="Toggle Sound Effects">
                <svg id="audioIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <span id="audioLabel">Sound</span>
            </button>
        </div>

    </main>

    <script>
        // State Variables
        let count = 0;
        let step = 1;
        let soundEnabled = true;

        // DOM Element References
        const counterValueEl = document.getElementById('counterValue');
        const counterStatusEl = document.getElementById('counterStatus');

        // Web Audio API context generator for subtle sound click effects
        let audioCtx = null;

        function playClickSound(isIncrement) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                
                // Pitch variation for increment vs decrement
                const freq = isIncrement ? (300 + Math.min(count * 5, 400)) : (220 - Math.min(Math.abs(count) * 3, 100));
                osc.frequency.setValueAtTime(Math.max(freq, 80), audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // Audio Context fallback silent fail
            }
        }

        function updateUI() {
            counterValueEl.textContent = count;
            
            // Trigger animation
            counterValueEl.classList.remove('number-bounce');
            void counterValueEl.offsetWidth; // Trigger reflow
            counterValueEl.classList.add('number-bounce');

            // Status indicator formatting
            if (count > 0) {
                counterStatusEl.textContent = 'Positive';
                counterStatusEl.className = 'text-xs font-medium text-emerald-400 mt-2 tracking-wider uppercase';
            } else if (count < 0) {
                counterStatusEl.textContent = 'Negative';
                counterStatusEl.className = 'text-xs font-medium text-rose-400 mt-2 tracking-wider uppercase';
            } else {
                counterStatusEl.textContent = 'Zero';
                counterStatusEl.className = 'text-xs font-medium text-slate-500 mt-2 tracking-wider uppercase';
            }
        }

        // Change Count Handler
        function changeCount(direction) {
            const isIncrement = direction > 0;
            count += (direction * step);
            playClickSound(isIncrement);
            updateUI();
        }

        // Reset Count Handler
        function resetCount() {
            count = 0;
            playClickSound(true);
            updateUI();
        }

        // Set Step Size Handler
        function setStep(newStep) {
            step = newStep;
            document.querySelectorAll('.step-btn').forEach(btn => {
                btn.className = 'step-btn px-3 py-1 rounded-lg font-semibold transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200';
            });
            const activeBtn = document.getElementById(`step-${newStep}`);
            if (activeBtn) {
                activeBtn.className = 'step-btn px-3 py-1 rounded-lg font-semibold transition bg-indigo-600 text-white shadow-sm';
            }
        }

        // Toggle Audio
        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const label = document.getElementById('audioLabel');
            const toggleBtn = document.getElementById('audioToggle');
            if (soundEnabled) {
                label.textContent = 'Sound';
                toggleBtn.classList.remove('opacity-50');
            } else {
                label.textContent = 'Muted';
                toggleBtn.classList.add('opacity-50');
            }
        }

        // Keyboard Shortcuts (ArrowUp, ArrowDown, Space, R)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                e.preventDefault();
                changeCount(1);
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                e.preventDefault();
                changeCount(-1);
            } else if (e.key === 'r' || e.key === 'R') {
                resetCount();
            }
        });

        // Initial setup
        updateUI();
    </script>
</body>
</html>
